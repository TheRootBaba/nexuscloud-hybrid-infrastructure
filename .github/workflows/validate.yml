name: NexusCloud validation

on:
  push:
    branches: [main, nexuscloud-v2]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare CI-only environment
        run: |
          cp .env.example .env
          sed -i 's/replace-with-a-long-unique-password/ci-only-not-a-production-secret/' .env

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Validate shell syntax
        run: |
          for script in scripts/validate.sh scripts/wireguard-preflight.sh scripts/wireguard-lab.sh; do
            bash -n "$script"
          done

      - name: Start application and monitoring stack
        run: docker compose up -d --wait --wait-timeout 120

      - name: Verify application endpoints
        run: |
          curl --fail --retry 12 --retry-delay 5 --retry-connrefused http://127.0.0.1:8081/
          curl --fail --retry 12 --retry-delay 5 --retry-connrefused http://127.0.0.1:8082/
          curl --fail --retry 12 --retry-delay 5 --retry-connrefused http://127.0.0.1:9091/-/ready
          curl --fail --retry 12 --retry-delay 5 --retry-connrefused http://127.0.0.1:3001/api/health

      - name: Verify Prometheus targets and rules
        run: |
          sleep 20
          python - <<'PY'
          import json, urllib.request
          def get(path):
              with urllib.request.urlopen("http://127.0.0.1:9091" + path, timeout=10) as response:
                  return json.load(response)["data"]
          targets = get("/api/v1/targets")["activeTargets"]
          expected = {"prometheus", "node-exporter", "blackbox-site-a", "blackbox-site-b"}
          jobs = {target["labels"]["job"] for target in targets}
          assert len(targets) == 4, f"expected 4 targets, got {len(targets)}"
          assert jobs == expected, f"unexpected jobs: {jobs}"
          assert all(target["health"] == "up" for target in targets), targets
          rules = [rule for group in get("/api/v1/rules")["groups"] for rule in group["rules"]]
          assert len(rules) == 3, f"expected 3 alert rules, got {len(rules)}"
          assert all(rule["health"] == "ok" for rule in rules), rules
          print("PASS: 4 Prometheus targets UP; 3 alert rules healthy")
          PY

      - name: Run full Linux acceptance suite
        run: bash scripts/validate.sh

      - name: Capture service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop integration stack
        if: always()
        run: docker compose down -v
