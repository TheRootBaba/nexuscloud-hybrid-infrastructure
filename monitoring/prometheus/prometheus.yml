global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: "nexuscloud-linux"
    static_configs:
      # Replace with actual reachable Node Exporter addresses.
      - targets:
          - "10.10.0.10:9100"
          - "10.20.0.10:9100"
